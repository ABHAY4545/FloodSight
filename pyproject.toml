[project]
name = "floodsight"
version = "1.0.0"
description = "Semantic segmentation and rapid damage assessment for post-flood aerial imagery using FloodNet"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "albumentations>=2.0.8",
    "ipykernel>=7.3.0",
    "kagglehub>=1.0.2",
    "matplotlib<3.11",
    "matplotlib-inline>=0.2.2",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "pillow>=12.3.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "tensorflow>=2.21.0",
    "torch>=2.13.0",
    "torchinfo>=1.8.0",
    "torchvision>=0.28.0",
    "tqdm>=4.70.0",
]
